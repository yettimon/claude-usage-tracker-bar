name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          PBXPROJ="ClaudeUsageTrackerBar.xcodeproj/project.pbxproj"
          sed -i '' 's/objectVersion = 77;/objectVersion = 55;/' "$PBXPROJ"
          sed -i '' '/preferredProjectObjectVersion = [0-9]*;/d' "$PBXPROJ"

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -scheme ClaudeUsageTrackerBar \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Ad-hoc sign
        run: |
          APP="build/DerivedData/Build/Products/Release/ClaudeUsageTrackerBar.app"
          codesign --deep --force --sign - "$APP"

      - name: Package as DMG
        run: |
          APP="build/DerivedData/Build/Products/Release/ClaudeUsageTrackerBar.app"
          hdiutil create \
            -volname "Claude Usage Tracker Bar" \
            -srcfolder "$APP" \
            -ov -format UDZO \
            "ClaudeUsageTrackerBar-${{ github.ref_name }}.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "ClaudeUsageTrackerBar-${{ github.ref_name }}.dmg"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
