name: Auto Release on Main

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next tag
        id: tag
        run: |
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          major=$(echo "$latest" | cut -d. -f1 | tr -d 'v')
          minor=$(echo "$latest" | cut -d. -f2)
          patch=$(echo "$latest" | cut -d. -f3)

          # Minor bump if the merge commit message starts with "feat:" or
          # contains "[minor]". Patch bump for everything else (fix:, chore:, docs:…).
          commit_msg=$(git log -1 --pretty=%s)
          if echo "$commit_msg" | grep -qE '^\s*feat(\(.+\))?:|^\s*feat!:|\[minor\]'; then
            plist_minor=$minor
            # Read minor from Info.plist — the PR author bumped it manually.
            if [ -f ClaudeUsageTrackerBar/Info.plist ]; then
              plist_ver=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ClaudeUsageTrackerBar/Info.plist 2>/dev/null || echo "")
              plist_major=$(echo "$plist_ver" | cut -d. -f1)
              plist_minor=$(echo "$plist_ver" | cut -d. -f2)
              if [ "$plist_major" = "$major" ] && [ "$plist_minor" -gt "$minor" ] 2>/dev/null; then
                minor=$plist_minor
                patch=0
              else
                minor=$((minor + 1))
                patch=0
              fi
            else
              minor=$((minor + 1))
              patch=0
            fi
            echo "Minor bump (feat): $latest → v${major}.${minor}.${patch}"
          else
            patch=$((patch + 1))
            echo "Patch bump: $latest → v${major}.${minor}.${patch}"
          fi

          new_tag="v${major}.${minor}.${patch}"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          PBXPROJ="ClaudeUsageTrackerBar.xcodeproj/project.pbxproj"
          sed -i '' 's/objectVersion = 77;/objectVersion = 55;/' "$PBXPROJ"
          sed -i '' '/preferredProjectObjectVersion = [0-9]*;/d' "$PBXPROJ"

      - name: Inject version into plist
        run: |
          VERSION="${{ steps.tag.outputs.new_tag }}"
          VERSION="${VERSION#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" ClaudeUsageTrackerBar/Info.plist

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -scheme ClaudeUsageTrackerBar \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Ad-hoc sign
        run: |
          APP="build/DerivedData/Build/Products/Release/ClaudeUsageTrackerBar.app"
          codesign --deep --force --sign - "$APP"

      - name: Package as DMG
        run: |
          APP="build/DerivedData/Build/Products/Release/ClaudeUsageTrackerBar.app"
          TAG="${{ steps.tag.outputs.new_tag }}"
          hdiutil create \
            -volname "Claude Usage Tracker Bar" \
            -srcfolder "$APP" \
            -ov -format UDZO \
            "ClaudeUsageTrackerBar-${TAG}.dmg"

      - name: Create tag
        run: |
          TAG="${{ steps.tag.outputs.new_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          files: "ClaudeUsageTrackerBar-${{ steps.tag.outputs.new_tag }}.dmg"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
