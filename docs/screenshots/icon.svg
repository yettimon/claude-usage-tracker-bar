<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">

  <!-- Asterisk: center (17,17), inner r=3, outer r=12, Claude orange -->
  <g stroke="#D4623A" stroke-width="3.4" stroke-linecap="round">
    <line x1="17" y1="14"    x2="17"    y2="5"/>
    <line x1="19.12" y1="14.88" x2="25.49" y2="8.51"/>
    <line x1="20"    y1="17"    x2="29"    y2="17"/>
    <line x1="19.12" y1="19.12" x2="25.49" y2="25.49"/>
    <line x1="17"    y1="20"    x2="17"    y2="29"/>
    <line x1="14.88" y1="19.12" x2="8.51"  y2="25.49"/>
    <line x1="14"    y1="17"    x2="5"     y2="17"/>
    <line x1="14.88" y1="14.88" x2="8.51"  y2="8.51"/>
  </g>

  <!-- Coin stack: 3 poker chips, center-x=27.5, rx=6, ry=2.2, 3.5px per coin -->
  <!-- Dark outline makes coins pop against asterisk and any bg -->

  <!-- Coin 3 (bottom) -->
  <rect x="21.5" y="28.3" width="12" height="3.5" fill="#B8720A"/>
  <path d="M 21.5 31.8 A 6 2.2 0 0 1 33.5 31.8" fill="#B8720A" stroke="#2B2B42" stroke-width="1.3" stroke-linejoin="round"/>
  <ellipse cx="27.5" cy="28.3" rx="6" ry="2.2" fill="#CC8800" stroke="#2B2B42" stroke-width="1.3"/>

  <!-- Coin 2 (middle) -->
  <rect x="21.5" y="24.6" width="12" height="3.7" fill="#CC8800"/>
  <path d="M 21.5 28.3 A 6 2.2 0 0 1 33.5 28.3" fill="#CC8800" stroke="#2B2B42" stroke-width="1.1"/>
  <ellipse cx="27.5" cy="24.6" rx="6" ry="2.2" fill="#E09200" stroke="#2B2B42" stroke-width="1.3"/>

  <!-- Coin 1 (top, brightest) -->
  <rect x="21.5" y="21" width="12" height="3.6" fill="#E09200"/>
  <path d="M 21.5 24.6 A 6 2.2 0 0 1 33.5 24.6" fill="#E09200" stroke="#2B2B42" stroke-width="1.1"/>
  <ellipse cx="27.5" cy="21" rx="6" ry="2.2" fill="#FFD700" stroke="#2B2B42" stroke-width="1.4"/>
  <!-- Highlight on top face -->
  <ellipse cx="27.5" cy="21" rx="3.5" ry="1.1" fill="#FFF5B0" opacity="0.85"/>

</svg>
